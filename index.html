    <script>
      // GitHub Pages SPA restore: read redirected path from query and restore it
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname + decoded + l.hash);
        }
      })();
    </script>
