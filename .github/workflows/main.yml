name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          # إنشاء مشروع مؤقت لجلب مجلدات الأندرويد والهيكل الصحيح
          flutter create temp_app --org com.example.app
          # نقل ملفاتك الحالية (مثل مجلد lib وملف pubspec) إلى المشروع المؤقت
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          # الدخول للمشروع المؤقت وبناء الـ APK منه مباشرة
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
